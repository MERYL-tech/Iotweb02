<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iotpage04</title>
    <link rel="shortcut icon" href="./images/iot.png" type="images/png" />
  </head>
  <!-- HTML  List TAG (Block Tag) -->

  <body>
    <!-- รายการแบบมีลำดับ type="1 , A , a ,I , i" -->
    <ol>
      <li>HEllo...</li>
      <li>Hi...</li>
      <li>Hey...</li>
    </ol>

    <ol type="A">
      <li>HEllo...</li>
      <li>Hi...</li>
      <li>Hey...</li>
    </ol>
    <ol type="i">
      <li>HEllo...</li>
      <li>Hi...</li>
      <li>Hey...</li>
    </ol>
    <!-- ol>il*3 -->

    <!-- รายการแบบไม่มีลำดับ circle, square -->
    <ul>
      <li>HEllo...</li>
      <li>Hi...</li>
      <li>Hey...</li>
    </ul>

    <ul type="circle">
      <li>HEllo...</li>
      <li>Hi...</li>
      <li>Hey...</li>
    </ul>

    <ul type="square">
      <li>HEllo...</li>
      <li>Hi...</li>
      <li>Hey...</li>
    </ul>

    <!-- รายการแบบนิยาม dl, dt, dd (มีหัวข้อ  มีคำบรรยาย) -->
    <dl>
    <dt>HTML</dt>
    <dd>เป็นภาษาที่ใช้ทำโครงหน้าเว็บ</dd>
    <dt>JAvaScript</dt>
    <dd>เป็นที่ใช้ในการเขียนโปรแกรมหน้าเว็บ</dd>
    </dl>

  </body>
</html>
