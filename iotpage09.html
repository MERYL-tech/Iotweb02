<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iotpage07</title>
    <link rel="shortcut icon" href="./images/iot.png" type="images/png" />
  </head>

  <body>
    <!-- HTML  From TAG (block tag) + From's Elments TAG (Inline Tag) -->
    <form action="" method="">
        
      <!-- พวกป้อนคำ -->
      <label for="">ป้อนอะก็ได้</label>
      <input type="text" name="" id="" placeholder="ป้อนชื่อ - สกุล" required />
      <br /><br />
      <label for="">ป้อนอะได้แค่เลข</label>
      <input type="number" name="" id="" placeholder="อายุ" />
      <br /><br />
      <label for="">ป้อนรหัสผ่าน</label>
      <input type="password" name="" id="" placeholder="อย่างน้อย6ตัวอักษร" />
      <br /><br />
      <label for="">ป้อนอีเมล์</label>
      <input type="email" name="" id="" placeholder="name@mail.com" />
      <br /><br />
        <label for="">ป้อนเยอะๆ</label>
        <textarea name="" id=""></textarea>
        <br><br>

      <!-- พวกเลือก -->
      <!-- เลือกได้แค่1 แล้วต้องเลือก -->
      <input type="radio" name="gender" id="" />ชาย
      <input type="radio" name="gender" id="" checked />หญิง
      <input type="radio" name="gender" id="" />LGBTQ+ <br /><br />
      <label for="">จังหวัด</label>
      <select name="" id=""> <!--Dropdown / Combobox-->
        <option value="">กทม</option>
        <option value="">นน</option>
        <option value="">ปทุม</option>
        <option value="">ระยอง</option>
        <option value="">เลย</option>
      </select>
      <br><br>

      <!-- เลือกได้มากกว่า1 หรือไม่เลือกก็ได้ -->
        <label for="">อาหารที่ชอบ</label>
      <input type="checkbox" name="" id="" checked/>MK  <!-- เลือกไว้ก่อนchecked -->
      <input type="checkbox" name="" id="" />KFC
      <input type="checkbox" name="" id="" />MC
      <br><br>

      <!-- เลือกวันอย่างเดียว -->
       <label for="">วันเกิด</label>
       <input type="date" name="" id="">
       <br><br>

      <!-- เลือกวันเวลาอย่างเดียว -->
       <label for="">เวลาเกิด</label>
       <input type="time" name="" id="">
       <br><br>

      <!-- เลือกวันและเวลาอย่างเดียว -->
       <label for="">วันเและเวลาทำงาน</label>
       <input type="datetime-local" name="" id="">
       <br><br>

      <!-- เลือกไฟล์แบบไม่กรองประเภทไฟล์ -->
       <label for="">เลือกไฟล์อะไนก็ได้</label>
       <input type="file" name="" id="">
       <br><br>

      <!-- เลือกไฟล์แบบกรองประเภทไฟล์  เช่น ไฟล์รูปอย่างเดียว-->
        <label for="">เลือกไฟล์รูปเท่านั้น</label>
        <input type="file" name="" id="" accept="image/*" />
        <br><br>

      <!-- เลือกไฟล์แบบกรองประเภทไฟล์  เช่น เฉพาะ doc, docx, pdf-->
         <label for="">เลือกไฟล์ word pdf</label>
          <input type="file" name="" id="" accept=".docx, .pdf, .doc" />
          <br><br>

       <!-- ปุ่มแบบกด เพื่อนำข้อมูลในฟอร์ม และ เลือกไปใช้งาน -->
        <input type="submit" value="บันทึก/ตกลง/ยืนยัน">
        <br><br>
       <!-- ปุ่มแบบกดเพื่อล้างข้อมูล -->
        <input type="reset" value="ล้างข้อมูล/ยกเลิก">
        <br><br>

       <!-- ปุ่มแบบกดเพื่อทำงานใดๆ -->
        <button>ข้อความแบบปุ่มแล้วแต่จะพิมพ์</button>
        <br><br>

        <!-- input type ประเภทที่ไม่แสดงที่หน้าจอ -->
        <!-- ใช้กรณี DEV อย่างใส่เองนำไปคำนวนด้วย userมองไม่เห็น -->
         <input type="hidden" name="vat" value="7">
    </form>
    <br><br>
    <!-- HTML Div TAG (block tag) -->
     <!-- กล่องที่มีความกว้างยึดเต็มพื้นที่ -->
     <div>
        contents...DIV
     </div>
     woooooo 


    <!-- HTML Span TAG (Inline tag) -->
     <!-- กล่องที่มีความกว้างไม่ยึดเต็มพื้นที่ มีขนาดเท่ากับตัว contens... (ต้องขั้นด้วย <br>) -->
     <span>
        contents...SPAN
     </span>
     wow wow wow
         


     
  </body>
</html>
